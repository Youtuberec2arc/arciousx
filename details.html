<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Details — HindiAnimeStuff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #f8f9fa;
    --bg-card: #ffffff;
    --border-color: #e5e7eb;
    --text-main: #111827;
    --text-dim: #4b5563;
    --crunchy-orange: #f47521;
    --crunchy-orange-hover: #ff8533;
    --gold: #d97706;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  
  .topbar {
    padding: 20px 24px;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
  }
  .back {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: color 0.2s ease;
  }
  .back:hover { color: var(--crunchy-orange); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .hero {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }
  .poster {
    flex: 0 0 260px;
    width: 260px;
    aspect-ratio: 2/3;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border-color);
    background: #e5e7eb;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .info { flex: 1; min-width: 280px; }
  .season-tag {
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--crunchy-orange);
    font-weight: 700;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    letter-spacing: 0.02em;
    line-height: 1.1;
    margin: 6px 0 12px;
  }
  
  .rating-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .rating-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    font-weight: 700;
    font-size: 1.5rem;
    color: var(--gold);
  }
  .rating-badge sub {
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  
  .genre-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .genre-tag {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-dim);
    background: #ffffff;
    border: 1px solid var(--border-color);
    padding: 4px 12px;
    border-radius: 15px;
  }

  .synopsis {
    color: var(--text-dim);
    line-height: 1.6;
    font-size: 0.95rem;
    margin: 24px 0;
  }

  .spec-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 30px;
    margin-bottom: 32px;
    background: #ffffff;
    padding: 20px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
  }
  .spec {
    border-left: 3px solid var(--crunchy-orange);
    padding-left: 12px;
  }
  .spec-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
  }
  .spec-value {
    font-size: 0.95rem;
    margin-top: 2px;
    font-weight: 600;
  }

  .watch-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--crunchy-orange);
    color: #ffffff;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 4px;
    font-size: 1rem;
    transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: 0 4px 12px rgba(244, 117, 33, 0.2);
  }
  .watch-btn:hover {
    background: var(--crunchy-orange-hover);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="Index.html" class="back">← Back to Catalog</a>
</div>

<main id="detailsContent">
  <!-- Content dynamically loaded via JS -->
</main>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const anime = ANIME_DATA.find(item => item.id === id);

  if(anime) {
    document.getElementById('detailsContent').innerHTML = `
      <div class="hero">
        <div class="poster">
          <img src="${anime.thumb}" alt="${anime.title}" onerror="this.style.display='none'">
        </div>
        <div class="info">
          <span class="season-tag">${anime.season}</span>
          <h1>${anime.title}</h1>
          <div class="rating-row">
            <span class="rating-badge">★ ${anime.rating}<sub>/10</sub></span>
            <div class="genre-tags">
              ${anime.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}
            </div>
          </div>
          <p class="synopsis">${anime.synopsis}</p>
          <div class="spec-grid">
            <div class="spec"><div class="spec-label">Language</div><div class="spec-value">${anime.language}</div></div>
            <div class="spec"><div class="spec-label">Episodes</div><div class="spec-value">${anime.episodes || anime.runtime}</div></div>
            <div class="spec"><div class="spec-label">Quality</div><div class="spec-value">${anime.quality}</div></div>
            <div class="spec"><div class="spec-label">Platform</div><div class="spec-value">${anime.platform}</div></div>
          </div>
          <a href="${anime.platformUrl}" target="_blank" class="watch-btn">Watch on ${anime.platform} ↗</a>
        </div>
      </div>
    `;
  } else {
    document.getElementById('detailsContent').innerHTML = `<h2>Anime not found.</h2>`;
  }
</script>
</body>
</html>
