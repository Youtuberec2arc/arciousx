<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HindiAnimeStuff — Dubbed Anime, Discovered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #f8f9fa;
    --bg-card: #ffffff;
    --border-color: #e5e7eb;
    --text-main: #111827;
    --text-dim: #4b5563;
    --crunchy-orange: #f47521;
    --crunchy-orange-hover: #ff8533;
    --gold: #d97706;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- TOP NAVIGATION LINKS ---------- */
  .nav-bar {
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
    padding: 12px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 20px;
  }
  .nav-link {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: color 0.2s ease;
  }
  .nav-link:hover {
    color: var(--crunchy-orange);
  }

  /* ---------- HEADER & SEARCH ---------- */
  header {
    padding: 40px 24px 20px;
    text-align: center;
    background: #ffffff;
    border-bottom: 1px solid var(--border-color);
  }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.03em;
    line-height: 1;
    color: var(--text-main);
    margin-bottom: 8px;
  }
  .brand span { color: var(--crunchy-orange); }
  .tagline {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 24px;
  }

  /* Crunchyroll Style Search Container */
  .search-container {
    max-width: 500px;
    margin: 0 auto 20px;
    position: relative;
  }
  .search-bar {
    width: 100%;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-family: inherit;
    border: 2px solid var(--border-color);
    border-radius: 30px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: var(--bg-main);
  }
  .search-bar:focus {
    border-color: var(--crunchy-orange);
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(244, 117, 33, 0.15);
  }

  .stat-strip {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--crunchy-orange); }
  .stat-label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }

  /* ---------- GENRE FILTER ---------- */
  .filter-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 24px 20px;
  }
  .filter-chip {
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    font-weight: 600;
    color: var(--text-dim);
    background: #ffffff;
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-chip:hover { border-color: var(--crunchy-orange); color: var(--crunchy-orange); }
  .filter-chip.active {
    background: var(--crunchy-orange);
    border-color: var(--crunchy-orange);
    color: #ffffff;
  }

  /* ---------- MAIN FRANCHISE GROUPS ---------- */
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .franchise { display: none; }
  .franchise.visible { display: block; }

  .franchise-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 8px;
  }
  .franchise-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.02em;
    color: var(--text-main);
  }
  .franchise-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .season-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  /* ---------- CRUNCHYROLL LITE CARD ---------- */
  .card {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-color: var(--crunchy-orange);
  }
  .card:hover .card-thumb img { transform: scale(1.04); }

  .card-thumb {
    flex: 0 0 100px;
    width: 100px;
    position: relative;
    overflow: hidden;
    background: #e5e7eb;
  }
  .card-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .thumb-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
    color: var(--crunchy-orange); opacity: 0.5;
  }

  .card-body {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    min-width: 0;
  }
  .card-season {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--crunchy-orange);
    font-weight: 700;
  }
  .card-title {
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.3;
    color: var(--text-main);
  }
  .card-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }
  .card-rating {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--gold);
  }
  .card-ep {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer {
    text-align: center;
    padding: 30px 24px;
    color: var(--text-dim);
    font-size: 0.8rem;
    border-top: 1px solid var(--border-color);
    background: #ffffff;
    line-height: 1.6;
  }
  footer strong { color: var(--text-main); }

  @media (max-width:480px){
    .stat-strip { gap: 15px; }
    .card-thumb { flex: 0 0 85px; width: 85px; }
  }
</style>
</head>
<body>

<div class="nav-bar">
  <a href="#" class="nav-link">About Us</a>
  <a href="#" class="nav-link">DMCA</a>
  <a href="#" class="nav-link">Request Anime</a>
</div>

<header>
  <div class="brand">HINDI<span>ANIME</span>STUFF</div>
  <div class="tagline">Dubbed anime, discovered. Watch officially, every time.</div>
  
  <div class="search-container">
    <input type="text" id="searchBar" class="search-bar" placeholder="Search anime series, movies or genres...">
  </div>

  <div class="stat-strip" id="statStrip"></div>
</header>

<div class="filter-row" id="filterRow"></div>

<main id="franchiseList"></main>

<footer>
  Every title here links out to its <strong>official streaming platform</strong> — Crunchyroll, Netflix, or Prime Video.<br>
  HindiAnimeStuff does not host, store, or distribute any video files.
</footer>

<script src="data.js"></script>
<script>
  const groups = {};
  const displayTitle = {};
  
  ANIME_DATA.forEach(item => {
    const key = item.franchise || item.title;
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
    if(!displayTitle[key] || item.title.length < displayTitle[key].length){
      displayTitle[key] = item.title;
    }
  });

  const totalSeasons = ANIME_DATA.length;
  const totalFranchises = Object.keys(groups).length;
  const allGenres = [...new Set(ANIME_DATA.flatMap(a => a.genres))].sort();
  
  document.getElementById('statStrip').innerHTML = `
    <div class="stat"><div class="stat-num">${totalFranchises}</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num">${totalSeasons}</div><div class="stat-label">Seasons & Films</div></div>
    <div class="stat"><div class="stat-num">${allGenres.length}</div><div class="stat-label">Genres</div></div>
  `;

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = `<button class="filter-chip active" data-genre="all">All</button>` +
    allGenres.map(g => `<button class="filter-chip" data-genre="${g}">${g}</button>`).join('');

  const list = document.getElementById('franchiseList');
  Object.entries(groups).forEach(([key, seasons]) => {
    const title = displayTitle[key];
    const genres = [...new Set(seasons.flatMap(s => s.genres))];
    const block = document.createElement('div');
    block.className = 'franchise visible';
    block.dataset.genres = genres.join(',').toLowerCase();
    block.dataset.title = title.toLowerCase();

    const seasonCards = seasons.map(item => `
      <a class="card" href="details.html?id=${item.id}">
        <div class="card-thumb">
          <div class="thumb-fallback">${item.season.replace('Season ', 'S')}</div>
          <img src="${item.thumb}" alt="${item.title} ${item.season}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="card-body">
          <span class="card-season">${item.season}</span>
          <div class="card-title">${item.title.length > 45 ? item.title.slice(0,42)+'…' : item.title}</div>
          <div class="card-foot">
            <span class="card-rating">★ ${item.rating}</span>
            <span class="card-ep">${item.episodes ? item.episodes + ' ep' : item.runtime}</span>
          </div>
        </div>
      </a>
    `).join('');

    block.innerHTML = `
      <div class="franchise-head">
        <span class="franchise-title">${title}</span>
        <span class="franchise-sub">${seasons.length} ${seasons.length > 1 ? 'seasons' : 'release'} · ${genres.slice(0,3).join(', ')}</span>
      </div>
      <div class="season-row">${seasonCards}</div>
    `;
    list.appendChild(block);
  });

  // Dual Filtering: Search Bar + Genre Chips logic
  const searchBar = document.getElementById('searchBar');
  
  function filterAnime() {
    const query = searchBar.value.toLowerCase().trim();
    const activeChip = filterRow.querySelector('.filter-chip.active');
    const selectedGenre = activeChip ? activeChip.dataset.genre.toLowerCase() : 'all';

    document.querySelectorAll('.franchise').forEach(f => {
      const titleMatches = f.dataset.title.includes(query);
      const genreData = f.dataset.genres.split(',');
      const genreMatches = selectedGenre === 'all' || genreData.includes(selectedGenre);
      
      // Secondary logic to search across genres via text field too
      const genreSearchMatches = genreData.some(g => g.includes(query));

      if ((titleMatches || genreSearchMatches) && genreMatches) {
        f.classList.add('visible');
      } else {
        f.classList.remove('visible');
      }
    });
  }

  searchBar.addEventListener('input', filterAnime);

  filterRow.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    filterAnime();
  });
</script>
</body>
</html>
