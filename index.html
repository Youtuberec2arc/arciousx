<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HindiAnimeStuff — Dubbed Anime, Discovered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void: #0a0e12;
    --bg-surface: #141a22;
    --bg-surface-hover: #1c2430;
    --border-color: #243040;
    --text-main: #f3f4f6;
    --text-dim: #9ca3af;
    --crunchy-orange: #f47521;
    --crunchy-orange-glow: rgba(244, 117, 33, 0.3);
    --gold: #ffb800;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-void);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- TOP NAVIGATION BAR WITH 3-DOT MENU ---------- */
  .nav-bar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 24px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    z-index: 100;
  }
  
  .menu-container {
    position: relative;
    display: inline-block;
  }

  /* 3-Dot Button Structure */
  .three-dots-btn {
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 50%;
    transition: background 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: center;
    align-items: center;
    height: 36px; width: 36px;
  }
  .three-dots-btn span {
    width: 4px; height: 4px;
    background-color: var(--text-main);
    border-radius: 50%;
    transition: background 0.2s;
  }
  .three-dots-btn:hover {
    background: var(--border-color);
  }
  .three-dots-btn:hover span {
    background-color: var(--crunchy-orange);
  }

  /* Dropdown Styling */
  .dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 42px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    min-width: 160px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .dropdown-menu.show {
    display: block;
  }
  .dropdown-link {
    display: block;
    color: var(--text-main);
    padding: 12px 16px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s, color 0.2s;
  }
  .dropdown-link:hover {
    background: var(--bg-surface-hover);
    color: var(--crunchy-orange);
  }

  /* ---------- HEADER & SEARCH ---------- */
  header {
    padding: 40px 24px 24px;
    text-align: center;
    position: relative;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50px; left: 50%;
    transform: translateX(-50%);
    width: 80%; height: 150px;
    background: radial-gradient(circle, rgba(244,117,33,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 7vw, 4.5rem);
    letter-spacing: 0.04em;
    line-height: 1;
    color: var(--text-main);
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(0,0,0,0.6);
  }
  .brand span { color: var(--crunchy-orange); }
  .tagline {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  /* Crunchyroll Premium Style Search Container */
  .search-container {
    max-width: 520px;
    margin: 0 auto 24px;
    position: relative;
  }
  .search-bar {
    width: 100%;
    padding: 14px 24px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-main);
    border: 2px solid var(--border-color);
    border-radius: 30px;
    outline: none;
    transition: all 0.25s ease;
    background: #0f141c;
  }
  .search-bar:focus {
    border-color: var(--crunchy-orange);
    box-shadow: 0 0 15px var(--crunchy-orange-glow);
    background: var(--bg-surface);
  }

  .stat-strip {
    display: flex;
    justify-content: center;
    gap: 36px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--crunchy-orange); letter-spacing: 0.02em; }
  .stat-label { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 2px; }

  /* ---------- GENRE FILTER ---------- */
  .filter-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 16px 20px 32px;
  }
  .filter-chip {
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-chip:hover { border-color: var(--crunchy-orange); color: var(--text-main); }
  .filter-chip.active {
    background: var(--crunchy-orange);
    border-color: var(--crunchy-orange);
    color: #ffffff;
    box-shadow: 0 4px 12px var(--crunchy-orange-glow);
  }

  /* ---------- MAIN CATALOG LAYOUT ---------- */
  main {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 20px 100px;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }
  .franchise { display: none; }
  .franchise.visible { display: block; }

  .franchise-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 10px;
  }
  .franchise-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.02em;
    color: var(--text-main);
  }
  .franchise-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .season-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }

  /* ---------- PREMIUM ANIME CARD ---------- */
  .card {
    display: flex;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: all 0.25s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--crunchy-orange);
    background: var(--bg-surface-hover);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  .card:hover .card-thumb img { transform: scale(1.05); }

  .card-thumb {
    flex: 0 0 105px;
    width: 105px;
    position: relative;
    overflow: hidden;
    background: #11161d;
  }
  .card-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .thumb-fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem;
    color: var(--crunchy-orange); opacity: 0.4;
  }

  .card-body {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    min-width: 0;
  }
  .card-season {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: var(--crunchy-orange);
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .card-title {
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.35;
    color: var(--text-main);
  }
  .card-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 2px;
  }
  .card-rating {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--gold);
  }
  .card-ep {
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer {
    text-align: center;
    padding: 40px 24px;
    color: var(--text-dim);
    font-size: 0.8rem;
    border-top: 1px solid var(--border-color);
    background: var(--bg-surface);
    line-height: 1.7;
  }
  footer strong { color: var(--text-main); }

  @media (max-width:480px){
    .stat-strip { gap: 20px; }
    .card-thumb { flex: 0 0 90px; width: 90px; }
    main { padding-bottom: 60px; }
  }
</style>
</head>
<body>

<div class="nav-bar">
  <div class="menu-container">
    <button class="three-dots-btn" id="menuBtn" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="dropdown-menu" id="dropdownMenu">
      <a href="#" class="dropdown-link">About Us</a>
      <a href="#" class="dropdown-link">Request Anime</a>
      <a href="#" class="dropdown-link">DMCA</a>
    </div>
  </div>
</div>

<header>
  <div class="brand">HINDI<span>ANIME</span>STUFF</div>
  <div class="tagline">Dubbed anime, discovered. Watch officially, every time.</div>
  
  <div class="search-container">
    <input type="text" id="searchBar" class="search-bar" placeholder="Search anime series, movies or genres...">
  </div>

  <div class="stat-strip" id="statStrip"></div>
</header>

<div class="filter-row" id="filterRow"></div>

<main id="franchiseList"></main>

<footer>
  Every title here links out to its <strong>official streaming platform</strong> — Crunchyroll, Netflix, or Prime Video.<br>
  HindiAnimeStuff does not host, store, or distribute any video files.
</footer>

<script src="data.js"></script>
<script>
  // Dropdown Toggle Logic
  const menuBtn = document.getElementById('menuBtn');
  const dropdownMenu = document.getElementById('dropdownMenu');

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    dropdownMenu.classList.remove('show');
  });

  // Structural Processing
  const groups = {};
  const displayTitle = {};
  
  ANIME_DATA.forEach(item => {
    const key = item.franchise || item.title;
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
    if(!displayTitle[key] || item.title.length < displayTitle[key].length){
      displayTitle[key] = item.title;
    }
  });

  const totalSeasons = ANIME_DATA.length;
  const totalFranchises = Object.keys(groups).length;
  const allGenres = [...new Set(ANIME_DATA.flatMap(a => a.genres))].sort();
  
  document.getElementById('statStrip').innerHTML = `
    <div class="stat"><div class="stat-num">${totalFranchises}</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num">${totalSeasons}</div><div class="stat-label">Seasons & Films</div></div>
    <div class="stat"><div class="stat-num">${allGenres.length}</div><div class="stat-label">Genres</div></div>
  `;

  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = `<button class="filter-chip active" data-genre="all">All</button>` +
    allGenres.map(g => `<button class="filter-chip" data-genre="${g}">${g}</button>`).join('');

  const list = document.getElementById('franchiseList');
  Object.entries(groups).forEach(([key, seasons]) => {
    const title = displayTitle[key];
    const genres = [...new Set(seasons.flatMap(s => s.genres))];
    const block = document.createElement('div');
    block.className = 'franchise visible';
    block.dataset.genres = genres.join(',').toLowerCase();
    block.dataset.title = title.toLowerCase();

    const seasonCards = seasons.map(item => `
      <a class="card" href="details.html?id=${item.id}">
        <div class="card-thumb">
          <div class="thumb-fallback">${item.season.replace('Season ', 'S')}</div>
          <img src="${item.thumb}" alt="${item.title} ${item.season}" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="card-body">
          <span class="card-season">${item.season}</span>
          <div class="card-title">${item.title.length > 45 ? item.title.slice(0,42)+'…' : item.title}</div>
          <div class="card-foot">
            <span class="card-rating">★ ${item.rating}</span>
            <span class="card-ep">${item.episodes ? item.episodes + ' ep' : item.runtime}</span>
          </div>
        </div>
      </a>
    `).join('');

    block.innerHTML = `
      <div class="franchise-head">
        <span class="franchise-title">${title}</span>
        <span class="franchise-sub">${seasons.length} ${seasons.length > 1 ? 'seasons' : 'release'} · ${genres.slice(0,3).join(', ')}</span>
      </div>
      <div class="season-row">${seasonCards}</div>
    `;
    list.appendChild(block);
  });

  // Live Search + Filter System
  const searchBar = document.getElementById('searchBar');
  
  function filterAnime() {
    const query = searchBar.value.toLowerCase().trim();
    const activeChip = filterRow.querySelector('.filter-chip.active');
    const selectedGenre = activeChip ? activeChip.dataset.genre.toLowerCase() : 'all';

    document.querySelectorAll('.franchise').forEach(f => {
      const titleMatches = f.dataset.title.includes(query);
      const genreData = f.dataset.genres.split(',');
      const genreMatches = selectedGenre === 'all' || genreData.includes(selectedGenre);
      const genreSearchMatches = genreData.some(g => g.includes(query));

      if ((titleMatches || genreSearchMatches) && genreMatches) {
        f.classList.add('visible');
      } else {
        f.classList.remove('visible');
      }
    });
  }

  searchBar.addEventListener('input', filterAnime);

  filterRow.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    filterAnime();
  });
</script>
</body>
</html>
