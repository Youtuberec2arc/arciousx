<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HindiAnimeStuff — Dubbed Anime, Discovered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0c0a0a;
    --card:#1a1010;
    --card-hover:#221414;
    --ember:#3a1818;
    --blood:#9e1b1b;
    --blood-bright:#d62c2c;
    --bone:#f0e4d0;
    --bone-dim:#9c8c7a;
    --gold:#c9a35a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ambient texture */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 70% 45% at 50% -5%, rgba(158,27,27,0.18), transparent 60%),
      radial-gradient(ellipse 50% 35% at 100% 95%, rgba(158,27,27,0.08), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, transparent 1px, transparent 2px);
    pointer-events:none;
    z-index:0;
    mix-blend-mode:overlay;
  }

  /* ---------- HEADER ---------- */
  header{
    position:relative;
    z-index:2;
    padding:52px 24px 28px;
    text-align:center;
  }
  .mark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .mark-glyph{
    width:28px;height:28px;
    border:2px solid var(--blood-bright);
    transform:rotate(45deg);
    position:relative;
  }
  .mark-glyph::after{
    content:'';
    position:absolute;
    inset:5px;
    background:var(--blood-bright);
  }
  .brand{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.1rem,7.5vw,4rem);
    letter-spacing:0.02em;
    line-height:1;
    white-space:nowrap;
  }
  .brand .hi{color:var(--bone);}
  .brand .ja{color:var(--blood-bright);}
  .tagline{
    margin-top:12px;
    color:var(--bone-dim);
    font-size:0.92rem;
    letter-spacing:0.04em;
    font-weight:500;
  }

  .stat-strip{
    display:flex;
    justify-content:center;
    gap:32px;
    margin-top:26px;
    flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--blood-bright);}
  .stat-label{font-size:0.65rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--bone-dim);}

  /* ---------- GENRE FILTER ---------- */
  .filter-row{
    position:relative;z-index:2;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    padding:0 20px 36px;
  }
  .filter-chip{
    font-size:0.72rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--bone-dim);
    background:transparent;
    border:1px solid var(--ember);
    padding:7px 16px;
    border-radius:100px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .filter-chip:hover{border-color:var(--blood-bright);color:var(--bone);}
  .filter-chip.active{
    background:var(--blood-bright);
    border-color:var(--blood-bright);
    color:#0c0a0a;
  }

  /* ---------- FRANCHISE GROUPS ---------- */
  main{
    position:relative;z-index:2;
    max-width:1080px;
    margin:0 auto;
    padding:0 20px 100px;
    display:flex;
    flex-direction:column;
    gap:44px;
  }

  .franchise{display:none;}
  .franchise.visible{display:block;}

  .franchise-head{
    display:flex;
    align-items:baseline;
    gap:14px;
    margin-bottom:16px;
    border-bottom:1px solid var(--ember);
    padding-bottom:10px;
  }
  .franchise-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
  }
  .franchise-sub{
    font-size:0.75rem;
    color:var(--bone-dim);
    letter-spacing:0.02em;
  }

  .season-row{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;
  }

  .card{
    display:flex;
    background:var(--card);
    border:1px solid var(--ember);
    border-radius:8px;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    position:relative;
    transition:border-color 0.25s ease, transform 0.2s ease, background 0.25s ease;
  }
  .card:hover{
    border-color:var(--blood-bright);
    background:var(--card-hover);
    transform:translateY(-2px);
  }
  .card:hover .card-thumb img{transform:scale(1.06);}
  .card:hover .slash{opacity:1;transform:translateX(0);}

  .card-thumb{
    flex:0 0 96px;
    width:96px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(160deg,#2a1414,#160a0a);
  }
  .card-thumb img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.4s ease;
    position:relative;
    z-index:1;
  }
  .thumb-fallback{
    position:absolute;inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Bebas Neue',sans-serif;
    font-size:1.6rem;
    color:var(--blood-bright);
    opacity:0.5;
    text-align:center;
    padding:8px;
  }

  .slash{
    position:absolute;
    top:0;bottom:0;left:0;
    width:3px;
    background:var(--blood-bright);
    opacity:0;
    transform:translateX(-4px);
    transition:all 0.25s ease;
  }

  .card-body{
    flex:1;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    min-width:0;
  }
  .card-season{
    font-size:0.68rem;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
  }
  .card-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.08rem;
    letter-spacing:0.01em;
    line-height:1.15;
  }
  .card-foot{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
  }
  .card-rating{
    font-family:'Bebas Neue',sans-serif;
    font-size:0.95rem;
    color:var(--blood-bright);
  }
  .card-ep{
    font-size:0.7rem;
    color:var(--bone-dim);
  }

  footer{
    position:relative;z-index:2;
    text-align:center;
    padding:28px 24px;
    color:var(--bone-dim);
    font-size:0.75rem;
    border-top:1px solid var(--ember);
    line-height:1.6;
  }
  footer strong{color:var(--bone);}

  @media (max-width:480px){
    .stat-strip{gap:20px;}
    .card-thumb{flex:0 0 76px;width:76px;}
    .card-title{font-size:0.98rem;}
  }
</style>
</head>
<body>

<header>
  <div class="mark"><div class="mark-glyph"></div></div>
  <div class="brand"><span class="hi">HINDI</span><span class="ja">ANIME</span><span class="hi">STUFF</span></div>
  <div class="tagline">Dubbed anime, discovered. Watch officially, every time.</div>
  <div class="stat-strip" id="statStrip"></div>
</header>

<div class="filter-row" id="filterRow"></div>

<main id="franchiseList"></main>

<footer>
  Every title here links out to its <strong>official streaming platform</strong> — Crunchyroll, Netflix, or Prime Video.
  HindiAnimeStuff does not host, store, or distribute any video files.
</footer>

<script src="data.js"></script>
<script>
  // group by franchise — use explicit franchise key if provided, else title
  const groups = {};
  const displayTitle = {};
  ANIME_DATA.forEach(item => {
    const key = item.franchise || item.title;
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
    if(!displayTitle[key] || item.title.length < displayTitle[key].length){
      displayTitle[key] = item.title;
    }
  });

  // stats
  const totalSeasons = ANIME_DATA.length;
  const totalFranchises = Object.keys(groups).length;
  const allGenres = [...new Set(ANIME_DATA.flatMap(a => a.genres))].sort();
  document.getElementById('statStrip').innerHTML = `
    <div class="stat"><div class="stat-num">${totalFranchises}</div><div class="stat-label">Series</div></div>
    <div class="stat"><div class="stat-num">${totalSeasons}</div><div class="stat-label">Seasons & Films</div></div>
    <div class="stat"><div class="stat-num">${allGenres.length}</div><div class="stat-label">Genres</div></div>
  `;

  // filter chips
  const filterRow = document.getElementById('filterRow');
  filterRow.innerHTML = `<button class="filter-chip active" data-genre="all">All</button>` +
    allGenres.map(g => `<button class="filter-chip" data-genre="${g}">${g}</button>`).join('');

  // build franchise blocks
  const list = document.getElementById('franchiseList');
  Object.entries(groups).forEach(([key, seasons]) => {
    const title = displayTitle[key];
    const genres = [...new Set(seasons.flatMap(s => s.genres))];
    const block = document.createElement('div');
    block.className = 'franchise visible';
    block.dataset.genres = genres.join(',');

    const seasonCards = seasons.map(item => `
      <a class="card" href="details.html?id=${item.id}">
        <div class="card-thumb">
          <div class="thumb-fallback">${item.season.replace('Season ', 'S')}</div>
          <img src="${item.thumb}" alt="${item.title} ${item.season}" loading="lazy"
               onerror="this.style.display='none'">
        </div>
        <div class="card-body">
          <span class="card-season">${item.season}</span>
          <div class="card-title">${item.title.length > 34 ? item.title.slice(0,32)+'…' : item.title}</div>
          <div class="card-foot">
            <span class="card-rating">★ ${item.rating}</span>
            <span class="card-ep">${item.episodes ? item.episodes + ' episodes' : item.runtime}</span>
          </div>
        </div>
        <div class="slash"></div>
      </a>
    `).join('');

    block.innerHTML = `
      <div class="franchise-head">
        <span class="franchise-title">${title}</span>
        <span class="franchise-sub">${seasons.length} ${seasons.length > 1 ? 'seasons' : 'release'} · ${genres.slice(0,3).join(', ')}</span>
      </div>
      <div class="season-row">${seasonCards}</div>
    `;
    list.appendChild(block);
  });

  // filtering
  filterRow.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const genre = btn.dataset.genre;
    document.querySelectorAll('.franchise').forEach(f => {
      const matches = genre === 'all' || f.dataset.genres.split(',').includes(genre);
      f.classList.toggle('visible', matches);
    });
  });
</script>

</body>
</html>
